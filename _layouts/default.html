<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="color-scheme" content="dark light">
  <script>
    // dark unless the visitor picked light before (set before the page is drawn, so it doesn't flash)
    (function () {
      var t = "dark";
      try { var s = localStorage.getItem("theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to the notes</a>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p class="site-desc">{{ site.description }}</p>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="label">Light</span>
      </button>
    </div>
  </header>

  <main id="content" class="wrap content">
    {{ content }}
  </main>

  <footer class="wrap site-footer">
    <p>Not affiliated with Capcom, NVIDIA or AMD.</p>
  </footer>

  <button type="button" class="to-top" id="to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
